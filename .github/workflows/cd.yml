name: CD - Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release revision for tagging
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracelattice-release-${{ github.sha }}
          path: ${{ runner.temp }}/tracelattice-release

      - name: Verify checksum
        run: |
          cd "$ARTIFACT_DIR"
          sha256sum --check --strict SHA256SUMS
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/tracelattice-release

      - name: Validate verification receipt
        id: artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/tracelattice-release
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/validate-release-receipt.mjs >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if npm view "@iworkforces/tracelattice@${{ steps.artifact.outputs.version }}" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: steps.check.outputs.published == 'false'
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_KEY }}

      - name: Configure git identity
        if: steps.check.outputs.published == 'false' && steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create git tag
        if: steps.check.outputs.published == 'false' && steps.publish.outcome == 'success'
        run: |
          git tag -a "${{ steps.artifact.outputs.tag }}" -m "Release ${{ steps.artifact.outputs.tag }}"
          git push origin "${{ steps.artifact.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.published == 'false' && steps.publish.outcome == 'success'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          generate_release_notes: true
